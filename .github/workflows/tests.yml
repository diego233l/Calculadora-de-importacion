name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, pdo_sqlite, mbstring, json
          coverage: none

      - name: Sintaxis de todos los ficheros PHP
        run: |
          fallos=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || fallos=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $fallos

      - name: Pruebas
        run: php tests/run.php

  herramientas:
    name: Herramientas offline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de los scripts de Python
        run: python3 -m py_compile scripts/boe/*.py scripts/geo/*.py tests/fixtures/anuncios/generar.py
      - name: Las fixtures del repositorio son las que genera el script
        run: |
          python3 -I tests/fixtures/anuncios/generar.py
          git diff --exit-code -- tests/fixtures/anuncios
