# Sitio nginx de la Calculadora de importación. Se copia a /etc/nginx/sites-available/calculadora-importacion
# y se activa con un enlace en sites-enabled (ver deploy/INSTALL.md). Es un sitio NUEVO en su propio puerto:
# no cambia ningún otro sitio ni la configuración global.

# Límite de peticiones por IP (esta directiva va en el contexto http, que es donde nginx incluye sites-enabled).
# Detrás de un proxy inverso o de Cloudflare, $binary_remote_addr sería la IP del proxy: en ese caso quita el limit_req de abajo.
limit_req_zone $binary_remote_addr zone=calculadora_importacion:10m rate=5r/s;

server {
    listen 8082;
    # listen [::]:8082;    # descomenta esta línea si la máquina tiene IPv6 activo (si no, `nginx -t` falla con «Address family not supported»)
    server_name _;

    root /opt/apps/calculadora-importacion/public;
    index index.php;

    access_log /var/log/nginx/calculadora-importacion.access.log;
    error_log  /var/log/nginx/calculadora-importacion.error.log warn;

    server_tokens off;
    client_max_body_size 256k;          # el texto de un anuncio pegado ocupa ~60 KB como mucho
    client_body_timeout 15s;
    send_timeout 20s;

    # Cabeceras de seguridad. La CSP y el resto de las de las páginas dinámicas las pone la propia aplicación (src/Web/App.php);
    # estas cubren los ficheros estáticos y los errores de nginx. HSTS solo tiene efecto si la web se sirve por https
    # (los navegadores lo ignoran sobre http): déjalo si pones TLS delante.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # Nada oculto (.git, .env…), ni ficheros de datos o copias de seguridad por si algún día cayeran en public/
    location ~ /\. {
        return 404;
    }
    location ~* \.(?:sqlite|db|json|log|bak|sql|md|py|sh|ya?ml|lock|key)$ {
        return 404;
    }

    # Ficheros estáticos: el CSS y el JS llevan ?v=<fecha> en la dirección, así que se pueden guardar mucho tiempo
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Todo lo demás lo resuelve el controlador frontal
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        limit_req zone=calculadora_importacion burst=20 nodelay;

        # Un add_header en este bloque anula los del server: aquí solo se añade HSTS y el resto de cabeceras (CSP, nosniff…)
        # las pone la aplicación, sin duplicados
        add_header Strict-Transport-Security "max-age=31536000" always;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_PROXY "";     # httpoxy
        fastcgi_pass unix:/run/php/calculadora-importacion.sock;
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
    }

    # Cualquier otro .php (no debería haber ninguno en public/)
    location ~ \.php$ {
        return 404;
    }
}
