; Pool de PHP-FPM propio de la Calculadora de importación.
; Se copia a /etc/php/<versión>/fpm/pool.d/calculadora-importacion.conf (fichero NUEVO: no toca los demás pools ni la
; configuración global de PHP). Todos los ajustes de PHP van con php_admin_* dentro de este pool, así que no afectan a
; ninguna otra web de la máquina.

[calculadora-importacion]
user = www-data
group = www-data

; Socket propio. nginx lo usa en deploy/nginx-calculadora-importacion.conf
listen = /run/php/calculadora-importacion.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Pocos procesos y solo cuando hacen falta: la web es pequeña y el pool no debe competir con las demás
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

security.limit_extensions = .php
catch_workers_output = yes
clear_env = yes

; --- opcache: el código se actualiza con `git pull`, así que se vuelve a mirar si ha cambiado (SOLO en este pool) ---
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2

; --- límites y endurecimiento ---
php_admin_value[open_basedir] = /opt/apps/calculadora-importacion/:/var/lib/calculadora-importacion/:/tmp/
php_admin_value[memory_limit] = 192M
php_admin_value[max_execution_time] = 25
php_admin_value[post_max_size] = 512K
php_admin_value[max_input_vars] = 200
php_admin_flag[file_uploads] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/calculadora-importacion/php-errores.log
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail,dl,symlink,link
php_admin_value[session.auto_start] = 0
php_admin_value[date.timezone] = Europe/Madrid
